package_managers:
  manager: dnf
  update:
    - sudo
    - dnf
    - update
    - "-y"
  install:
    - sudo
    - dnf
    - install
    - "-y"
    - "--allowerasing"
  repo:
    rpmfusion-nonfree:
      - sudo
      - dnf
      - install
      - "-y"
      - "https://download1.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ fedora_version }}.noarch.rpm"
    rpmfusion-free:
      - sudo
      - dnf
      - install
      - "-y"
      - "https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ fedora_version }}.noarch.rpm"
    ghostty:
      - sudo
      - dnf
      - copr
      - enable
      - scottames/ghostty
      - "-y"
    docker:
      - sudo
      - dnf
      - config-manager
      - addrepo
      - "--from-repofile=https://download.docker.com/linux/fedora/docker-ce.repo"
    google-chrome:
      - sudo
      - dnf
      - install
      - "-y"
      - "https://dl.google.com/linux/direct/google-chrome-stable_current_x86_64.rpm"
    # lazygit:
    #   - sudo
    #   - dnf
    #   - copr
    #   - enable
    #   - "atim/lazygit"
    #   - "-y"
  dependencies:
    core:
      - git
      - curl
      - wget
      - gcc
      - make
      - unzip
      - zsh
      - golang
      - cargo
      - g++
      - python3
      - ruby
      - unrar
      - p7zip
      - p7zip-plugins
      - xdg-user-dirs
      - lsd
      - java
      - dnf-utils
      - flatpak
      - kernel-devel
      - gcc
      - make
      - automake
      - perl
      - elfutils-libelf-devel
      - fontconfig
      - btop
