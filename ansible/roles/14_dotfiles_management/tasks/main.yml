---
# =============================================================================
# Role: 14_dotfiles_management
# Descripción: Despliegue de dotfiles usando sentu-dotfiles (Go)
# Reemplaza la lógica anterior de symlinks por copia de archivos
# =============================================================================

# Asegurar que los directorios base existen
- name: Asegurar que los directorios base existen
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ user_home }}/.config"
    - "{{ user_home }}/.local/share"
    - "{{ user_home }}/.sentu_backup"
  become: no

# Verificar si sentu-dotfiles está instalado
- name: Verificar si sentu-dotfiles está en PATH
  command: "which sentu-dotfiles"
  register: sentu_dotfiles_path
  ignore_errors: yes
  changed_when: false
  become: no

# Si no está instalado, verificar si el binario existe en ~/.local/bin
- name: Verificar si sentu-dotfiles existe en ~/.local/bin
  stat:
    path: "{{ user_home }}/.local/bin/sentu-dotfiles"
  register: sentu_dotfiles_bin
  become: no
  when: sentu_dotfiles_path.rc != 0

# Si no existe el binario, verificar si Go está instalado
- name: Verificar si Go está instalado
  command: "which go"
  register: go_path
  ignore_errors: yes
  changed_when: false
  become: no
  when:
    - sentu_dotfiles_path.rc != 0
    - not sentu_dotfiles_bin.stat.exists | default(false)

# Compilar sentu-dotfiles desde el repositorio
- name: Compilar sentu-dotfiles desde el repositorio
  command:
    cmd: "go build -ldflags='-s -w' -o {{ user_home }}/.local/bin/sentu-dotfiles ./cmd/sentu-dotfiles"
    chdir: "{{ user_home }}/dotfiles"
  environment:
    PATH: "{{ ansible_env.PATH | default('') }}:/usr/local/go/bin:{{ user_home }}/go/bin"
  become: no
  when:
    - sentu_dotfiles_path.rc != 0
    - not sentu_dotfiles_bin.stat.exists | default(false)
    - go_path.rc == 0

# Si no hay Go ni binario, mostrar error instructivo
- name: Fallar si no hay Go ni binario precompilado
  fail:
    msg: |
      ❌ sentu-dotfiles no está instalado y Go no está disponible para compilarlo.

      Opciones:
      1. Instalá Go manualmente y volvé a ejecutar el playbook.
      2. Descargá un binario precompilado desde GitHub Releases y colocalo en ~/.local/bin/sentu-dotfiles
      3. Usá el script install.sh: curl -fsSL ... | bash
  when:
    - sentu_dotfiles_path.rc != 0
    - not sentu_dotfiles_bin.stat.exists | default(false)
    - go_path.rc != 0

# Asegurar que ~/.local/bin está en PATH para esta sesión
- name: Asegurar PATH para sentu-dotfiles
  set_fact:
    sentu_dotfiles_cmd: "{{ user_home }}/.local/bin/sentu-dotfiles"
  become: no

# Ejecutar deploy de dotfiles
- name: Desplegar dotfiles con sentu-dotfiles
  command: "{{ sentu_dotfiles_cmd | default('sentu-dotfiles') }} deploy"
  register: deploy_result
  changed_when: "'desplegados' in deploy_result.stdout"
  become: no

- name: Mostrar resultado del deploy
  debug:
    msg: "{{ deploy_result.stdout_lines }}"
  become: no
